<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerAI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="navbar">

        <a href="index.html" class="logo">
            <img
                src="logoo.png"
                alt="CareerAI Logo"
                class="logo-image"
            >
        </a>

        <div class="nav-buttons">
            <a href="login.html" class="login-btn">Login</a>
            <a href="signup.html" class="signup-btn">Sign up</a>
        </div>

    </header>


    <!-- LANDING PAGE -->
    <main class="hero">

        <!-- TEXT ABOVE VIDEO -->
        <h1 class="hero-text top-text">
            From where you are,
        </h1>


        <!-- VIDEO -->
        <div class="video-card">

            <video
             class="hero-video"
            autoplay
            muted
            loop
            playsinline
            >
            <source src="selection.mp4" type="video/mp4">
            </video>

        </div>


        <!-- TEXT BELOW VIDEO -->
        <h1 class="hero-text bottom-text">
            to where you want to be.
        </h1>


        <!-- FEATURES -->
        <section class="features-section">

            <div class="features-row">

                <!-- 1 - UP -->
                <div class="feature-box">
                    AI Voice Assistant
                </div>


                <!-- 2 - DOWN -->
                <div class="feature-box feature-down">
                    Resume Builder
                </div>


                <!-- 3 - UP -->
                <div class="feature-box">
                    Resume Optimizer
                </div>


                <!-- 4 - DOWN -->
                <div class="feature-box feature-down">
                    ATS Score Checker
                </div>


                <!-- 5 - UP -->
                <div class="feature-box">
                    Job Matcher
                </div>


                <!-- 6 - DOWN -->
                <div class="feature-box feature-down">
                    Application Tracker
                </div>


                <!-- 7 - UP -->
                <div class="feature-box">
                    Trusted by 1000 people
                </div>

            </div>

        </section>

    </main>

</body>

</html>
