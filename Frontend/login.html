<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerAI - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

    <div class="auth-container">

        <div class="auth-visual">

            <a href="landing.html" class="auth-logo">
                Career<span>AI</span>
            </a>

            <div class="auth-welcome">
                <h1>WELCOME<br>BACK!</h1>

                <p>
                    Take a step forward<br>
                    in your career.
                </p>
            </div>

        </div>

        <div class="auth-form">

            <h1>Welcome back</h1>

            <p class="form-subtitle">
                Login to continue your career journey.
            </p>

            <form id="loginForm">

                <label for="loginEmail">Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="loginPassword">Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="form-button">
                    Login
                </button>

                <p class="form-message" id="loginMessage"></p>

            </form>

            <p class="switch-form">
                Don't have an account?
                <a href="signup.html">Sign up</a>
            </p>

        </div>

    </div>

        <!-- your login form/content above -->

    <!-- Login Assistant -->
    <div class="form-assistant">
        <img src="cursor2.png" alt="CareerAI Assistant">
    </div>

    <script src="script.js"></script>
</body>
</html>
