<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerAI</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="navbar">

    <a href="index.html" class="logo">
        <img
            src="logoo.png"
            alt="CareerAI Logo"
            class="logo-image"
        >
    </a>

    <div class="nav-buttons">
        <a href="login.html" class="login-btn">Login</a>
        <a href="signup.html" class="signup-btn">Sign up</a>
    </div>

    </header>


    <!-- LANDING PAGE -->
    <main class="hero">

        <!-- TEXT ABOVE VIDEO -->
        <h1 class="hero-text top-text">
            From where you are,
        </h1>


        <!-- VIDEO -->
        <div class="video-card">

            <video
                class="hero-video"
                autoplay
                muted
                loop
                playsinline
                controls
            >
                <source src="selection.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

        </div>


        <!-- TEXT BELOW VIDEO -->
        <h1 class="hero-text bottom-text">
            to where you want to be.
        </h1>

    </main>

</body>
</html>
